<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Library</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {elmnt.innerHTML = this.responseText;}
                            if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    return;
                }
            }
        }
        document.addEventListener("DOMContentLoaded", includeHTML);
    </script>
</head>
<body>

    <div w3-include-html="menu.html"></div>

    <div class="header">
        <h1><span class="campaign-label">2026</span> Delta Dental of Washington</h1>
    </div>

    <div class="section-card">
        <h2 id="combo-awe-videos">Seattle Storm Sponsorship<span class="live-date"><br />Climate Pledge Arena</span></h2>
        
        <h3 id="day-vs-night">Baseboard LED</h3>
        <div class="asset-grid">
            <div class="asset-item" onclick="openModal('https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-FullCourt-Baseline-864x96-v1.mp4?raw=true')">
                <img class="asset-thumbnail" src="https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-FullCourt-Baseline-864x96-v1.png?raw=true">
                <div class="asset-caption">Full Court Coverage</div>
            </div>
            <div class="asset-item" onclick="openModal('https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-GameReady-Baseline-864x96-v1.mp4?raw=true')">
                <img class="asset-thumbnail" src="https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-GameReady-Baseline-864x96-v1.png?raw=true">
                <div class="asset-caption">Game-ready</div>
            </div>
            <div class="asset-item" onclick="openModal('https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-HealthySmile-Baseline-864x96-v4.mp4?raw=true')">
                <img class="asset-thumbnail" src="https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-HealthySmile-Baseline-864x96-v4.png?raw=true">
                <div class="asset-caption">Healthy Smile</div>
            </div>
            <div class="asset-item" onclick="openModal('https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-PlaySomeD-Baseline-864x96-v2.mp4?raw=true')">
                <img class="asset-thumbnail" src="https://github.com/ApprovalPage/DD-CPA-LED/blob/main/R1/DD-PlaySomeD-Baseline-864x96-v2.png?raw=true">
                <div class="asset-caption">Play Some D</div>
            </div>
        </div>


    </div>

<!-- Updated to stream video and display images -->
<div id="assetModal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFullSize" style="display: none;">
    
    <video class="modal-content" id="videoFullSize" controls autoplay playsinline style="display: none;">
        <source id="videoSource" src="" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

    <script>
        const modal = document.getElementById("assetModal");
        const modalVid = document.getElementById("vidFullSize");

        function openModal(url) {
		const modal = document.getElementById("assetModal");
    	const imgElement = document.getElementById("imgFullSize");
    	const videoElement = document.getElementById("videoFullSize");
    	const videoSource = document.getElementById("videoSource");

    	modal.style.display = "flex";

    	// Check if the URL is a video
    	if (url.toLowerCase().includes('.mp4')) {
        imgElement.style.display = "none";
        videoElement.style.display = "block";
        
        // Load and play video
        videoSource.src = url;
        videoElement.load(); // Forces the browser to start looking at the file immediately
        videoElement.play();
    } else {
        // Handle as image
        videoElement.style.display = "none";
        imgElement.style.display = "block";
        imgElement.src = url;
    }
}

		function closeModal() {
		const modal = document.getElementById("assetModal");
    	const videoElement = document.getElementById("videoFullSize");
    
    	modal.style.display = "none";
    
    	// Crucial: Stop the video and clear source so it doesn't keep loading in the background
    	videoElement.pause();
    	document.getElementById("videoSource").src = "";
		videoElement.load();
}

        // Prevent clicking the video controls from closing the modal
        modalVid.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeModal();
        });
    </script>
</body>
</html>
